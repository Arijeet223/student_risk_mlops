name: CI - Test and Docker Build

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest -v


  docker-build:

    runs-on: ubuntu-latest

    needs: test

    # Don't push Docker images when someone only opens a Pull Request
    if: github.event_name == 'push'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/student-risk-api:latest .


      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/student-risk-api:latest